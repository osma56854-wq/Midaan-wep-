name: Validate MIDAAN frontend
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check skill-upload-utils.js
          node --check sw.js
      - name: Test navigation regression checks
        run: node --test tests/navigation.test.cjs tests/skill-upload-utils.test.cjs tests/maintenance.test.cjs tests/marketplace.test.cjs tests/rfq.test.cjs tests/team.test.cjs
      - name: Check required frontend files and security settings
        run: |
          test -s index.html
          test -s app.js
          test -s skill-upload-utils.js
          test -s tests/skill-upload-utils.test.cjs
          test -s tests/maintenance.test.cjs
          test -s tests/marketplace.test.cjs
          test -s tests/rfq.test.cjs
          test -s tests/team.test.cjs
          test -s supabase/migrations/20261110210000_organization_invitations_and_team_roles.sql
          test -s supabase/migrations/20261110200000_global_rfq_and_quotes.sql
          test -s supabase/migrations/20261110201000_limit_rfq_updates_to_status.sql
          test -s supabase/migrations/20261110202000_snapshot_rfq_title.sql
          test -s supabase/migrations/20261110203000_index_rfq_foreign_keys.sql
          test -s supabase/migrations/20261110190000_global_industrial_marketplace.sql
          test -s supabase/migrations/20261110140644_create_maintenance_tasks.sql
          test -s supabase/migrations/20261110140827_index_maintenance_task_foreign_keys.sql
          test -s manifest.webmanifest
          test -s midaan-icon.svg
          test -s sw.js
          grep -q 'Content-Security-Policy' index.html
          grep -q 'https://lkofveroqcrfehczdlkl.supabase.co' app.js
          grep -q 'sb_publishable_' app.js
          grep -q 'create_organization_with_owner' app.js
          grep -q 'create_skill' app.js
          grep -q 'PASSWORD_RECOVERY' app.js
          echo "MIDAAN frontend static checks passed."
